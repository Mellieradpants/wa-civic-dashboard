name: Tmp Scan Colon Lettered Duties R2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Scan real bills for colon-plus-lettered-item duty sentences (round 2, grammar-grounded boundary rules)
        run: node scripts/tmp-scan-colon-lettered-duties-r2.js

      - name: Commit results file
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tmp-scan-colon-lettered-duties-r2-results.txt
          git diff --staged --quiet || git commit -m "Add round 2 colon-plus-lettered-item duty scan results for review"
          git pull --rebase
          git push origin HEAD
