name: Tmp Scan Nonduty Categories

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Scan real bill sentences for non-duty categories
        run: node scripts/tmp-scan-nonduty-categories.js

      - name: Commit results file
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tmp-scan-nonduty-categories-results.txt
          git diff --staged --quiet || git commit -m "Add nonduty-categories discovery sweep results for review"
          git pull --rebase
          git push origin HEAD
