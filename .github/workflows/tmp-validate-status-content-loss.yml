name: Tmp Validate Status Content Loss Fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch main for comparison
        run: git fetch origin main

      - name: Compare status-attached rendering, branch vs main, across sampled corpus
        run: node scripts/tmp-validate-status-content-loss.js

      - name: Commit results file
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tmp-validation-content-loss-results.txt
          git diff --staged --quiet || git commit -m "Add corpus-wide status-attach content-loss validation results"
          git pull --rebase
          git push origin HEAD
