name: Pipeline PR check

on:
  pull_request:
    paths:
      - '.github/workflows/pipeline-pr-check.yml'
      - 'api/plain-meaning.js'
      - 'api/wa-bill-text.js'
      - 'lib/legislation/**'
      - 'lib/plain-meaning/**'
      - 'legislation.html'
      - 'scripts/test-bills.js'
      - 'scripts/test-structure-selection.js'
      - 'data/wa/parser-fixtures/**'
      - 'package*.json'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
