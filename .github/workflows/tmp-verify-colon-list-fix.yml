name: Tmp Verify Colon List Fix

on:
  workflow_dispatch:
  push:
    branches:
      - fix-colon-list-item-drops
    paths:
      - scripts/tmp-verify-colon-list-fix.js
      - .github/workflows/tmp-verify-colon-list-fix.yml
      - lib/plain-meaning/pipeline.js

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify colon-list item-drop fix across the sampled corpus
        run: node scripts/tmp-verify-colon-list-fix.js

      - name: Commit results file
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tmp-verify-colon-list-fix-results.txt
          git diff --staged --quiet || git commit -m "Add colon-list fix verification results for review"
          git pull --rebase
          git push origin HEAD
