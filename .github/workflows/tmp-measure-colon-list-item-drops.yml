name: Tmp Measure Colon List Item Drops

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Measure colon-lettered list item drops against the live pipeline
        run: node scripts/tmp-measure-colon-list-item-drops.js

      - name: Commit results file
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tmp-measure-colon-list-item-drops-results.txt
          git diff --staged --quiet || git commit -m "Add colon list item drop measurement results for review"
          git pull --rebase
          git push origin HEAD
